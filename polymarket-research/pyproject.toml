[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polytrader"
version = "0.1.0"
description = "Research system for analyzing Polymarket traders and identifying top-performing wallets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Polymarket Trader Research" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "networkx>=3.2",
    "SQLAlchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "python-dateutil>=2.8",
    "requests>=2.31",
    "httpx>=0.26",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.109", "uvicorn[standard]>=0.27", "streamlit>=1.30", "plotly>=5.18", "jinja2>=3.1"]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7.4"]

[project.scripts]
polytrader = "polytrader.cli:main"

[tool.setuptools.packages.find]
include = ["polytrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
